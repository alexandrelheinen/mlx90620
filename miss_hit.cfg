# MISS_HIT configuration — https://florianschanda.github.io/miss_hit/
project_root

# Local directory names only (must exist next to this file).
exclude_dir: "docs"
exclude_dir: "firmware"
exclude_dir: "artifacts"
ignore_dir: ".pio"
ignore_dir: ".git"

line_length: 100
tab_width: 2
file_length: 2000
copyright_location: "file_header"
copyright_entity: "Alexandre Loeblein Heinen"
copyright_entity: "Clyvian Ribeiro Borges"

# Relax PascalCase defaults so camelCase package helpers are accepted.
regex_function_name: "[A-Za-z][A-Za-z0-9_]*"
regex_script_name: "[A-Za-z][A-Za-z0-9_]*"
regex_parameter_name: "[A-Za-z][A-Za-z0-9_]*"
regex_method_name: "[A-Za-z][A-Za-z0-9_]*"
regex_nested_name: "[A-Za-z][A-Za-z0-9_]*"
