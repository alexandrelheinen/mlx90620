; PlatformIO project for the scan MLX90620 example (Arduino Uno).
; From repo root: pio run -d firmware/examples/scan

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_extra_dirs =
  ../../lib
  ../../external
lib_deps =
  arduino-libraries/Servo@^1.2.0
build_flags =
  -Wall
  -Wextra
monitor_speed = 9600
