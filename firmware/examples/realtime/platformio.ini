; PlatformIO project for the realtime MLX90620 example (Arduino Uno).
; From repo root: pio run -d firmware/examples/realtime

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_extra_dirs =
  ../../lib
  ../../external
build_flags =
  -Wall
  -Wextra
monitor_speed = 9600
