[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx90620-host"
version = "1.0.0"
description = "Python host tools for the MLX90620 Arduino thermal camera project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Alexandre Loeblein Heinen" },
  { name = "Clyvian Ribeiro Borges" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyserial>=3.5",
  "Pillow>=10.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.6",
  "mlx90620-host[gui]",
]

[project.scripts]
mlx90620 = "mlx90620.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mlx90620"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
